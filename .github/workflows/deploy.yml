name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # main ブランチに push されたときにデプロイ

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # 好みで Node バージョン指定

      # 依存関係インストール
      - name: Install dependencies
        run: npm ci

      # Vite build
      - name: Build
        run: npm run build

      # build 出力を GitHub Pages 用にアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./dist

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
